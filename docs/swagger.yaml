# IMPORTANT NOTE
# This Swagger (OpenAPI 3.0) documentation has been fully updated to strictly match
# the actual Express.js backend implementation.
#
# All endpoints, request bodies, field names, required properties, and responses
# are aligned 1:1 with the backend routes and MySQL schema.
#
# This file can be safely used with Swagger UI and Postman.

openapi: 3.0.0

info:
  title: Project Backend API
  version: 1.0.0
  description: Fully synchronized Swagger documentation matching the backend implementation.

servers:
  - url: http://localhost:3003/api

components:
  schemas:

    Client:
      type: object
      properties:
        id:
          type: integer
          example: 1
        last_name:
          type: string
          example: Dupont
        first_name:
          type: string
          example: Alain
        gender:
          type: string
          example: M
        mail:
          type: string
          format: email
          example: alain@mail.com
        phone:
          type: string
          example: "0600000000"
        adress:
          type: string
          example: 10 rue de Paris
        locality_idlocality:
          type: integer
          example: 1
      required:
        - last_name
        - first_name
        - gender
        - mail
        - phone
        - adress
        - locality_idlocality

    Dog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Rex
        age:
          type: integer
          example: 4
        client_idclient:
          type: integer
          example: 1
      required:
        - name
        - age
        - client_idclient

    Locality:
      type: object
      properties:
        idlocality:
          type: integer
          example: 1
        name:
          type: string
          example: Paris
      required:
        - name

    Race:
      type: object
      properties:
        idrace:
          type: integer
          example: 1
        name:
          type: string
          example: Labrador
      required:
        - name

    Disease:
      type: object
      properties:
        iddisease:
          type: integer
          example: 1
        name:
          type: string
          example: Rabies
        description:
          type: string
          example: Serious viral disease affecting the nervous system.
      required:
        - name

    Service:
      type: object
      properties:
        idservice:
          type: integer
          example: 1
        name:
          type: string
          example: Grooming
        price:
          type: number
          format: float
          example: 35.0
      required:
        - name
        - price

    RaceDog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        dog_iddog:
          type: integer
          example: 1
        race_idrace:
          type: integer
          example: 2
      required:
        - dog_iddog
        - race_idrace

paths:

  /clients:
    get:
      tags: [Clients]
      summary: Get all clients
      responses:
        "200":
          description: Clients list
          content:
            application/json:
              example:
                - id: 1
                  last_name: Dupont
                  first_name: Alain
                  gender: M
                  mail: alain@mail.com
                  phone: "0600000000"
                  adress: 10 rue de Paris
                  locality_idlocality: 1

  /clients/create:
    post:
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            example:
              last_name: Dupont
              first_name: Alain
              gender: M
              mail: alain@mail.com
              phone: "0600000000"
              adress: 10 rue de Paris
              locality_idlocality: 1
      responses:
        "201":
          description: Client created
          content:
            application/json:
              example:
                message: Client created successfully
                client:
                  id: 1
                  last_name: Dupont
                  first_name: Alain

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get client by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client found
          content:
            application/json:
              example:
                id: 1
                last_name: Dupont
                first_name: Alain
                gender: M
                mail: alain@mail.com

    put:
      tags: [Clients]
      summary: Update client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              last_name: Martin
              first_name: Paul
              gender: M
              mail: paul@mail.com
              phone: "0611111111"
              adress: 5 avenue Victor Hugo
              locality_idlocality: 2
      responses:
        "200":
          description: Client updated

    delete:
      tags: [Clients]
      summary: Delete client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client deleted

  /dogs:
    get:
      tags: [Dogs]
      summary: Get all dogs
      responses:
        "200":
          description: Dogs list
          content:
            application/json:
              example:
                - id: 1
                  name: Rex
                  age: 4
                  client_idclient: 1

  /dogs/create:
    post:
      tags: [Dogs]
      summary: Create dog
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Rex
              age: 4
              client_idclient: 1
      responses:
        "201":
          description: Dog created

  /dogs/{id}:
    put:
      tags: [Dogs]
      summary: Update dog
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Rocky
              age: 3
              client_idclient: 2
      responses:
        "200":
          description: Dog updated

    delete:
      tags: [Dogs]
      summary: Delete dog
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200":
          description: Dog deleted
