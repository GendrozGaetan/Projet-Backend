# Informations générales sur le Swagger

openapi: 3.0.0
info:
  title: API Backend du Projet
  version: 1.0.0
  description: >
    Documentation complète de l'API incluant les opérations CRUD,
    les schémas de données et les exemples de requêtes et réponses.

# Addresse du Swagger pour la consultation

servers:
  - url: http://localhost:3003/api

# Liste et informations sur les différents composants du programme et sa base de donnée

components:
  schemas:

    Client:
      type: object
      properties:
        id: { type: integer }
        firstname: { type: string }
        lastname: { type: string }
        email: { type: string }
        phone: { type: string }
      required: [firstname, lastname, email]

    Dog:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        age: { type: integer }
        client_id: { type: integer }
      required: [name, age, client_id]

    Race:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      required: [name]

    Locality:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      required: [name]

    Disease:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
      required: [name]

    Service:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number, format: float }
      required: [name, price]

    RaceDog:
      type: object
      properties:
        id: { type: integer }
        dog_id: { type: integer }
        race_id: { type: integer }
      required: [dog_id, race_id]

paths:

  ##############################################
  # CLIENTS
  ##############################################

  /clients:

  # Processus pour retrouver les clients dans la base de données

    get:
      summary: Liste des clients
      responses:
        "200":
          description: Liste récupérée
          content:
            application/json:
              example:
                - id: 1
                  firstname: Alain
                  lastname: Dupont
                  email: alain@exemple.com
                  phone: "0600000000"

    post:

  # Processus pour ajouter un client à la base de données

      summary: Ajouter un client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Client" }
            example:
              firstname: Pierre
              lastname: Martin
              email: pierre@example.com
              phone: "0612345678"
      responses:
        "201":
          description: Client créé

  /clients/{id}:

  # Processus pour retrouver un client précis dans la base de données

    get:
      summary: Récupérer un client
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200":
          description: Client trouvé
          content:
            application/json:
              example:
                id: 1
                firstname: Alain
                lastname: Dupont
                email: alain@exemple.com

  # Processus pour modifier un client précis dans la base de données

    put:
      summary: Modifier un client
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Client" }
            example:
              firstname: Paul
              lastname: Durand
              email: paul@example.com
              phone: "0645454545"
      responses:
        "200": { description: Client modifié }

    # Processus pour supprimer un client précis dans la base de données

    delete:
      summary: Supprimer un client
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Client supprimé }

  ##############################################
  # DOGS
  ##############################################

  /dogs:

  # Processus pour afficher les chiens dans la base de données

    get:
      summary: Liste des chiens
      responses:
        "200":
          description: Liste récupérée

  # Processus pour ajouter un chien à la base de données

    post:
      summary: Ajouter un chien
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Dog" }
            example:
              name: Rex
              age: 4
              client_id: 1
      responses:
        "201": { description: Chien créé }

  /dogs/{id}:

  # Processus pour retrouver un chien précis dans la base de données

    get:
      summary: Récupérer un chien
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200":
          description: Chien trouvé

  # Processus pour modifier un chien précis dans la base de données


    put:
      summary: Modifier un chien
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        content:
          application/json:
            example:
              name: Rocky
              age: 3
              client_id: 2
      responses:
        "200": { description: Chien modifié }

  # Processus pour supprimer un chien précis dans la base de données

    delete:
      summary: Supprimer un chien
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Chien supprimé }


  ##############################################
  # LOCALITY
  ##############################################

  /locality:

  # Processus pour afficher les localités dans la base de données

    get:
      summary: Liste des localités
      responses:
        "200": { description: OK }

  # Processus pour ajouter une localité dans la base de données

    post:
      summary: Ajouter une localité
      requestBody:
        content:
          application/json:
            example:
              name: Paris
      responses:
        "201": { description: Créé }

  /locality/{id}:

  # Processus pour modifier une localité précis dans la base de données

    put:
      summary: Modifier une localité
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        content:
          application/json:
            example:
              name: Lyon
      responses:
        "200": { description: OK }

  # Processus pour supprimer une localité précis dans la base de données

    delete:
      summary: Supprimer une localité
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Supprimé }


  ##############################################
  # RACES
  ##############################################

  /races:

  # Processus pour afficher les races de la base de données

    get:
      summary: Liste des races
      responses:
        "200": { description: OK }

  # Processus pour ajouter une race à la base de données

    post:
      summary: Ajouter une race
      requestBody:
        content:
          application/json:
            example:
              name: Labrador
      responses:
        "201": { description: Créé }

  /races/{id}:

  # Processus pour modifier une race précise dans la base de données

    put:
      summary: Modifier une race
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        content:
          application/json:
            example:
              name: Bulldog
      responses:
        "200": { description: OK }

  # Processus pour supprimer une race dans la base de données

    delete:
      summary: Supprimer une race
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Supprimé }


  ##############################################
  # DISEASES
  ##############################################

  /diseases:

  # Processus pour afficher les maladies de la base de données

    get:
      summary: Liste des maladies
      responses:
        "200": { description: OK }

  # Processus pour ajouter une maladie à la base de données

    post:
      summary: Ajouter une maladie
      requestBody:
        content:
          application/json:
            example:
              name: Rage
              description: Maladie virale grave.
      responses:
        "201": { description: Créé }

  /diseases/{id}:

  # Processus pour modifier une maladie

    put:
      summary: Modifier une maladie
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        content:
          application/json:
            example:
              name: Parvovirose
              description: Infection virale.
      responses:
        "200": { description: OK }

  # Processus pour supprimer une maladie

    delete:
      summary: Supprimer une maladie
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Supprimé }


  ##############################################
  # SERVICES
  ##############################################

  /services:

  # Processus pour afficher les services de la base de données

    get:
      summary: Liste des services
      responses:
        "200": { description: OK }

  # Processus pour ajouter un service à la base de données

    post:
      summary: Ajouter un service
      requestBody:
        content:
          application/json:
            example:
              name: Toilettage
              price: 35.0
      responses:
        "201": { description: Créé }

  /services/{id}:

  # Processus pour modifier un service

    put:
      summary: Modifier un service
      parameters:
        - in: path
          name: id
          required: true
      requestBody:
        content:
          application/json:
            example:
              name: Pension
              price: 50.0
      responses:
        "200": { description: OK }

  # Processus pour supprimer un service

    delete:
      summary: Supprimer un service
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Supprimé }


  ##############################################
  # RACES_DOGS
  ##############################################

  /races_dogs:

  # Processus pour afficher les races de la base de données

    get:
      summary: Liste des associations race-chien
      responses:
        "200": { description: OK }

  # Processus pour ajouter une race à la base de données

    post:
      summary: Associer une race à un chien
      requestBody:
        content:
          application/json:
            example:
              dog_id: 1
              race_id: 2
      responses:
        "201": { description: Créé }

  /races_dogs/{id}:

  # Processus pour supprimer une race

    delete:
      summary: Supprimer une association race-chien
      parameters:
        - in: path
          name: id
          required: true
      responses:
        "200": { description: Supprimé }
