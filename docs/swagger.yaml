# IMPORTANT NOTE
# This Swagger (OpenAPI 3.0) documentation has been fully updated to strictly match
# the actual Express.js backend implementation.
#
# All endpoints (GET, POST, PUT, DELETE), request bodies, field names,
# required properties, and responses are aligned 1:1 with the backend routes
# and MySQL database schema.
#
# This file can be safely used with Swagger UI and Postman.

openapi: 3.0.0

info:
  title: Project Backend API
  version: 1.0.1
  description: Complete and synchronized API documentation with correct example values.

servers:
  - url: http://localhost:3003/api

components:
  schemas:

    Client:
      type: object
      properties:
        id:
          type: integer
          example: 1
        last_name:
          type: string
          example: Dupont
        first_name:
          type: string
          example: Alain
        gender:
          type: string
          enum: [M, F]
          example: M
        mail:
          type: string
          format: email
          example: alain.dupont@example.com
        phone:
          type: string
          example: "0612345678"
        adress:
          type: string
          example: "10 rue de Paris, 75001 Paris"
        locality_idlocality:
          type: integer
          example: 1
      required:
        - last_name
        - first_name
        - gender
        - mail
        - phone
        - adress
        - locality_idlocality

    Dog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Rex
        age:
          type: integer
          example: 5
        client_idclient:
          type: integer
          example: 1
      required: [name, age, client_idclient]

    Locality:
      type: object
      properties:
        idlocality:
          type: integer
          example: 1
        name:
          type: string
          example: Paris
      required: [name]

    Race:
      type: object
      properties:
        idrace:
          type: integer
          example: 1
        name:
          type: string
          example: Labrador
      required: [name]

    Disease:
      type: object
      properties:
        iddisease:
          type: integer
          example: 1
        name:
          type: string
          example: Rabies
        description:
          type: string
          example: "Viral disease affecting the nervous system"
      required: [name]

    Service:
      type: object
      properties:
        idservice:
          type: integer
          example: 1
        name:
          type: string
          example: Grooming
        price:
          type: number
          format: float
          example: 35.0
      required: [name, price]

    RaceDog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        dog_iddog:
          type: integer
          example: 1
        race_idrace:
          type: integer
          example: 2
      required: [dog_iddog, race_idrace]

paths:

  /clients:
    get:
      tags: [Clients]
      summary: Get all clients
      responses:
        "200":
          description: Clients list
          content:
            application/json:
              example:
                - id: 1
                  last_name: Dupont
                  first_name: Alain
                  gender: M
                  mail: alain.dupont@example.com
                  phone: "0612345678"
                  adress: "10 rue de Paris, 75001 Paris"
                  locality_idlocality: 1

  /clients/create:
    post:
      tags: [Clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            example:
              last_name: Martin
              first_name: Pauline
              gender: F
              mail: pauline.martin@example.com
              phone: "0698765432"
              adress: "5 avenue Victor Hugo, 69003 Lyon"
              locality_idlocality: 2
      responses:
        "201":
          description: Client created

  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get client by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Client found

    put:
      tags: [Clients]
      summary: Update client
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              last_name: Durand
              first_name: Michel
              gender: M
              mail: michel.durand@example.com
              phone: "0622334455"
              adress: "12 rue Lafayette, 75009 Paris"
              locality_idlocality: 1
      responses:
        "200":
          description: Client updated

    delete:
      tags: [Clients]
      summary: Delete client
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Client deleted

  /dogs:
    get:
      tags: [Dogs]
      summary: Get all dogs
      responses:
        "200":
          description: Dogs list

  /dogs/create:
    post:
      tags: [Dogs]
      summary: Create dog
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Buddy
              age: 3
              client_idclient: 1
      responses:
        "201":
          description: Dog created

  /dogs/{id}:
    put:
      tags: [Dogs]
      summary: Update dog
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Rocky
              age: 4
              client_idclient: 2
      responses:
        "200":
          description: Dog updated

    delete:
      tags: [Dogs]
      summary: Delete dog
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Dog deleted

  /locality:
    get:
      tags: [Locality]
      summary: Get all localities
      responses:
        "200":
          description: Localities list

  /locality/create:
    post:
      tags: [Locality]
      summary: Create locality
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Lyon
      responses:
        "201":
          description: Locality created

  /locality/{id}:
    put:
      tags: [Locality]
      summary: Update locality
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Marseille
      responses:
        "200":
          description: Locality updated

    delete:
      tags: [Locality]
      summary: Delete locality
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Locality deleted

  /races:
    get:
      tags: [Races]
      summary: Get all races
      responses:
        "200":
          description: Races list

  /races/create:
    post:
      tags: [Races]
      summary: Create race
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Labrador
      responses:
        "201":
          description: Race created

  /races/{id}:
    put:
      tags: [Races]
      summary: Update race
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Beagle
      responses:
        "200":
          description: Race updated

    delete:
      tags: [Races]
      summary: Delete race
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Race deleted

  /diseases:
    get:
      tags: [Diseases]
      summary: Get all diseases
      responses:
        "200":
          description: Diseases list

  /diseases/create:
    post:
      tags: [Diseases]
      summary: Create disease
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Distemper
              description: "Highly contagious viral disease in dogs"
      responses:
        "201":
          description: Disease created

  /diseases/{id}:
    put:
      tags: [Diseases]
      summary: Update disease
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Parvovirus
              description: "Contagious viral infection causing severe gastrointestinal symptoms"
      responses:
        "200":
          description: Disease updated

    delete:
      tags: [Diseases]
      summary: Delete disease
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Disease deleted

  /services:
    get:
      tags: [Services]
      summary: Get all services
      responses:
        "200":
          description: Services list

  /services/create:
    post:
      tags: [Services]
      summary: Create service
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Grooming
              price: 40.0
      responses:
        "201":
          description: Service created

  /services/{id}:
    put:
      tags: [Services]
      summary: Update service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Boarding
              price: 50.0
      responses:
        "200":
          description: Service updated

    delete:
      tags: [Services]
      summary: Delete service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Service deleted

  /races_dogs:
    get:
      tags: [RaceDog]
      summary: Get race-dog associations
      responses:
        "200":
          description: Associations list

  /races_dogs/create:
    post:
      tags: [RaceDog]
      summary: Create race-dog association
      requestBody:
        required: true
        content:
          application/json:
            example:
              dog_iddog: 1
              race_idrace: 1
      responses:
        "201":
          description: Association created

  /races_dogs/{id}:
    put:
      tags: [RaceDog]
      summary: Update race-dog association
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              dog_iddog: 2
              race_idrace: 2
      responses:
        "200":
          description: Association updated

    delete:
      tags: [RaceDog]
      summary: Delete race-dog association
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Association deleted
